name: Publish fdroid repo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 */2 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TG_ID: ${{ secrets.TG_ID }}
      TG_HASH: ${{ secrets.TG_HASH }}
      KEYSTOREPASS: ${{ secrets.KEYSTOREPASS }}
      KEYSTORE_B64: ${{ secrets.KEYSTORE }}
      TG_SESSION_B64: ${{ secrets.TG_SESSION }}
    steps:
    - uses: actions/checkout@v6

    # Everything the pipeline needs (fdroidserver, apksigner, apktool,
    # apkeditor, imagemagick, 7z, rsync, python + httpx/telethon) comes from
    # flake.lock.  No apt, no Launchpad PPA: those 503s used to silently fall
    # back to Ubuntu's ancient fdroidserver, which then choked on config.yml.
    - uses: cachix/install-nix-action@v32
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install toolchain
      run: |
        nix develop --command bash -e -c '
          fdroid --version
          for t in fdroid apksigner java rsync apktool APKEditor 7z magick wget bwrap; do
            command -v "$t" >/dev/null || { echo "::error::$t is missing from the dev shell"; exit 1; }
          done
          python3 -c "import httpx, telethon"
        '

    - name: Setup keystore and Telegram session
      run: |
        umask 077
        printf '%s' "$KEYSTORE_B64" | base64 -d > fdroid/keystore.jks
        test -s fdroid/keystore.jks
        printf '%s' "$TG_SESSION_B64" | base64 -d > main.session

    - name: Build repository
      run: nix develop --command bash ./scripts/publish.sh

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: public
        retention-days: 2

  # Splitting the deploy out of the build job is not cosmetic.  deploy-pages
  # looks the artifact up a fraction of a second after it was finalized and the
  # artifact service does not always return it yet, which fails the run with
  # "Found 0 artifact(s)" (actions/deploy-pages#451).  A separate job lets the
  # listing catch up, and re-running this job can no longer upload a second
  # artifact, which used to wedge the run for good (actions/deploy-pages#338).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Wait for the artifact listing to catch up
      run: sleep 120

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
      continue-on-error: true

    - name: Back off before retrying
      if: steps.deployment.outcome == 'failure'
      run: sleep 300

    - name: Deploy to GitHub Pages (retry)
      if: steps.deployment.outcome == 'failure'
      uses: actions/deploy-pages@v5
